<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4c1d95" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jos" />
  <title>Jos — إدارة الباقات والخطوط</title>
  <link id="pwa-manifest-link" rel="manifest" href="manifest.json" />
  <style>
    :root {
      --primary: #4c1d95;
      --primary-dark: #2e1065;
      --primary-light: #ede9fe;
      --accent: #7c3aed;
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(76, 29, 149, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* شاشة تسجيل الدخول */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 55%, var(--accent) 100%);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .brand-badge {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      display: flex;
